<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <script>
    (function () {
      try {
        var t = localStorage.getItem("mizrachi-stories-theme");
        if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lives Changed — Stories from Rabbi Yosef Mizrachi’s viewers</title>
  <meta name="description" content="Real stories from people whom Rabbi Yosef Mizrachi has brought back to Hashem. An independent collection of public YouTube comments.">
  <meta name="robots" content="index,follow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Source+Sans+3:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --paper: #f7f1e6;
      --card: #fffaf2;
      --ink: #2b241c;
      --muted: #6d6154;
      --rule: #e2d6c6;
      --accent: #8b4a2f;
      --accent-soft: #f0e0d4;
      --heart: #9b3d3d;
      --shadow: 0 1px 2px rgba(60, 40, 20, 0.04), 0 10px 28px rgba(60, 40, 20, 0.06);
      --glow: #fffdf8;
      --controls-bg: rgba(247, 241, 230, 0.97);
      --controls-fade: rgba(247, 241, 230, 0);
      --tab-hover-border: #c9b8a4;
      --search-focus-border: #c4a48a;
      --card-border: rgba(226, 214, 198, 0.9);
      --accent-underline: rgba(139, 74, 47, 0.35);
      color-scheme: light;
    }
    html[data-theme="dark"] {
      --paper: #1a1612;
      --card: #262019;
      --ink: #f3ebe0;
      --muted: #b8aa9a;
      --rule: #3e352b;
      --accent: #d4a286;
      --accent-soft: rgba(212, 162, 134, 0.22);
      --heart: #d07a7a;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.28), 0 10px 28px rgba(0, 0, 0, 0.32);
      --glow: #241e18;
      --controls-bg: rgba(26, 22, 18, 0.97);
      --controls-fade: rgba(26, 22, 18, 0);
      --tab-hover-border: #6a5c4e;
      --search-focus-border: #c4a48a;
      --card-border: rgba(80, 68, 54, 0.9);
      --accent-underline: rgba(212, 162, 134, 0.45);
      color-scheme: dark;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme]) {
        --paper: #1a1612;
        --card: #262019;
        --ink: #f3ebe0;
        --muted: #b8aa9a;
        --rule: #3e352b;
        --accent: #d4a286;
        --accent-soft: rgba(212, 162, 134, 0.22);
        --heart: #d07a7a;
        --shadow: 0 1px 2px rgba(0, 0, 0, 0.28), 0 10px 28px rgba(0, 0, 0, 0.32);
        --glow: #241e18;
        --controls-bg: rgba(26, 22, 18, 0.97);
        --controls-fade: rgba(26, 22, 18, 0);
        --tab-hover-border: #6a5c4e;
        --search-focus-border: #c4a48a;
        --card-border: rgba(80, 68, 54, 0.9);
        --accent-underline: rgba(212, 162, 134, 0.45);
        color-scheme: dark;
      }
    }
    * { box-sizing: border-box; }
    html {
      scroll-behavior: smooth;
      background-color: var(--paper);
    }
    body {
      margin: 0;
      background:
        radial-gradient(1200px 500px at 50% -10%, var(--glow) 0%, transparent 60%),
        var(--paper);
      color: var(--ink);
      font-family: "Source Sans 3", "Segoe UI", sans-serif;
      font-size: 17px;
      line-height: 1.55;
      min-height: 100vh;
    }
    .wrap {
      width: min(780px, calc(100% - 40px));
      margin: 0 auto;
      padding: 4.5rem 0 5rem;
    }
    header.intro {
      text-align: center;
      margin-bottom: 2.75rem;
    }
    h1 {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-weight: 600;
      font-size: clamp(2.6rem, 7vw, 3.9rem);
      line-height: 1.05;
      margin: 0 0 1.2rem;
      letter-spacing: -0.02em;
    }
    .lede {
      margin: 0 auto;
      max-width: 38rem;
      color: var(--muted);
      font-size: 1.08rem;
      line-height: 1.7;
    }
    .share {
      margin: 1.05rem 0 0;
      font-size: 0.95rem;
      font-weight: 500;
    }
    .share a {
      color: var(--accent);
      text-decoration: underline;
      text-decoration-color: var(--accent-underline);
      text-underline-offset: 0.18em;
      text-decoration-thickness: 1px;
    }
    .share a:hover {
      color: var(--ink);
      text-decoration-color: var(--accent);
    }
    .nobr { white-space: nowrap; }
    .controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 0.45rem 1rem;
      margin-bottom: 2rem;
      position: sticky;
      top: 0;
      z-index: 5;
      padding: 0.85rem 0 0.9rem;
      background: linear-gradient(to bottom, var(--controls-bg) 70%, var(--controls-fade));
    }
    .tabs {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.45rem;
      flex: 1 0 100%;
    }
    .tabs button {
      appearance: none;
      border: 1px solid var(--rule);
      background: transparent;
      color: var(--muted);
      font-family: inherit;
      font-size: 0.82rem;
      font-weight: 500;
      letter-spacing: 0.01em;
      padding: 0.42rem 0.85rem;
      border-radius: 999px;
      cursor: pointer;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
    }
    .tabs button:hover { border-color: var(--tab-hover-border); color: var(--ink); }
    .tabs button[aria-selected="true"] {
      background: var(--ink);
      border-color: var(--ink);
      color: var(--paper);
    }
    .search {
      position: relative;
      flex: 1 1 14rem;
      min-width: min(14rem, 100%);
      max-width: 420px;
    }
    .search input {
      width: 100%;
      border: 1px solid var(--rule);
      background: var(--card);
      border-radius: 999px;
      padding: 0.65rem 1rem 0.65rem 2.4rem;
      font-family: inherit;
      font-size: 0.95rem;
      color: var(--ink);
      outline: none;
    }
    .search input:focus { border-color: var(--search-focus-border); box-shadow: 0 0 0 3px var(--accent-soft); }
    .search input::placeholder { color: var(--muted); }
    .search svg {
      position: absolute;
      left: 0.9rem;
      top: 50%;
      transform: translateY(-50%);
      width: 16px;
      height: 16px;
      stroke: var(--muted);
      fill: none;
      pointer-events: none;
    }
    .count {
      flex: 0 1 auto;
      margin: 0;
      color: var(--muted);
      font-size: 0.85rem;
      white-space: nowrap;
    }
    .cards { display: flex; flex-direction: column; gap: 1.15rem; }
    article.card {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 1.55rem 1.6rem 1.3rem;
      box-shadow: var(--shadow);
      user-select: text;
    }
    .flags {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.65rem 0.9rem;
      margin: 0 0 0.75rem;
    }
    .translated-mark {
      font-size: 0.72rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      font-weight: 600;
      color: var(--accent);
    }
    .orig-toggle, .expand-btn {
      appearance: none;
      border: 0;
      background: none;
      padding: 0;
      font-family: inherit;
      font-size: 0.86rem;
      font-weight: 500;
      color: var(--accent);
      cursor: pointer;
      text-decoration: underline;
      text-underline-offset: 0.18em;
    }
    .orig-toggle:hover, .expand-btn:hover { color: var(--ink); }
    .orig-toggle:focus-visible, .expand-btn:focus-visible, .like-btn:focus-visible, .meta a.video:focus-visible, .tabs button:focus-visible, .share a:focus-visible, .theme-toggle:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }
    blockquote.quote {
      margin: 0;
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: clamp(1.25rem, 2.6vw, 1.5rem);
      font-weight: 500;
      font-style: normal;
      line-height: 1.45;
      letter-spacing: -0.01em;
      user-select: text;
      cursor: text;
      overflow: hidden;
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 5;
      line-clamp: 5;
    }
    blockquote.quote.is-expanded {
      display: block;
      -webkit-line-clamp: unset;
      line-clamp: unset;
      overflow: visible;
    }
    .expand-btn { margin-top: 0.65rem; }
    .meta {
      display: flex;
      flex-wrap: nowrap;
      align-items: baseline;
      gap: 0.35rem 0.75rem;
      margin-top: 1.15rem;
      padding-top: 0.95rem;
      border-top: 1px solid var(--rule);
      color: var(--muted);
      font-size: 0.9rem;
      line-height: 1.45;
      min-width: 0;
    }
    .meta .author {
      color: var(--ink);
      font-weight: 600;
      white-space: nowrap;
      flex: 0 0 auto;
    }
    .meta .date {
      white-space: nowrap;
      flex: 0 0 auto;
    }
    .meta a.video {
      flex: 1 1 auto;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-style: italic;
      color: var(--accent);
      text-decoration: underline;
      text-decoration-color: var(--accent-underline);
      text-underline-offset: 0.18em;
      text-decoration-thickness: 1px;
    }
    .meta a.video:hover {
      text-decoration-color: var(--accent);
    }
    .meta .like-btn {
      flex: 0 0 auto;
      margin-left: auto;
      align-self: baseline;
    }
    .like-btn {
      appearance: none;
      border: 0;
      background: none;
      position: relative;
      display: inline-flex;
      align-items: baseline;
      padding: 0 0 0 1.3em;
      font-family: inherit;
      font-size: inherit;
      font-weight: 500;
      line-height: inherit;
      color: var(--muted);
      cursor: pointer;
    }
    .like-btn svg {
      position: absolute;
      left: 0;
      top: 50%;
      width: 1em;
      height: 1em;
      transform: translateY(-50%);
      fill: none;
      stroke: var(--heart);
      stroke-width: 1.7;
      stroke-linejoin: round;
      transition: fill 0.15s, transform 0.15s;
      pointer-events: none;
    }
    .like-btn[aria-pressed="true"] svg {
      fill: var(--heart);
      stroke: var(--heart);
    }
    .like-btn:hover svg { transform: translateY(-50%) scale(1.06); }
    .like-btn.is-busy { cursor: default; opacity: 0.7; }
    .like-btn .like-count { min-width: 0.8em; }
    .empty, .error {
      text-align: center;
      color: var(--muted);
      padding: 3rem 1rem;
    }
    footer.site-footer {
      margin-top: 3.5rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--rule);
      color: var(--muted);
      font-size: 0.82rem;
      text-align: center;
      line-height: 1.65;
    }
    .theme-toggle {
      position: fixed;
      right: max(0.85rem, env(safe-area-inset-right));
      bottom: max(0.85rem, env(safe-area-inset-bottom));
      z-index: 10;
      width: 2.05rem;
      height: 2.05rem;
      padding: 0;
      appearance: none;
      border: 1px solid var(--rule);
      border-radius: 999px;
      background: var(--card);
      color: var(--muted);
      box-shadow: var(--shadow);
      display: grid;
      place-items: center;
      cursor: pointer;
    }
    .theme-toggle:hover { color: var(--ink); border-color: var(--tab-hover-border); }
    .theme-toggle svg {
      width: 15px;
      height: 15px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.7;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .theme-toggle .icon-sun { display: none; }
    .theme-toggle .icon-moon { display: block; }
    html[data-theme="dark"] .theme-toggle .icon-sun { display: block; }
    html[data-theme="dark"] .theme-toggle .icon-moon { display: none; }
    html[data-theme="light"] .theme-toggle .icon-sun { display: none; }
    html[data-theme="light"] .theme-toggle .icon-moon { display: block; }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme]) .theme-toggle .icon-sun { display: block; }
      :root:not([data-theme]) .theme-toggle .icon-moon { display: none; }
    }
    @media (max-width: 640px) {
      .meta {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr) auto;
        grid-template-areas:
          "author title like"
          ".      date  .";
        align-items: baseline;
        column-gap: 0.75rem;
        row-gap: 0.15rem;
      }
      .meta .author { grid-area: author; }
      .meta .date { grid-area: date; }
      .meta a.video { grid-area: title; }
      .meta .like-btn { grid-area: like; margin-left: 0; align-self: baseline; }
    }
    @media (max-width: 400px) {
      .meta {
        grid-template-columns: minmax(0, 1fr);
        grid-template-areas:
          "author"
          "title"
          "date"
          "like";
        row-gap: 0.25rem;
      }
      .meta .author {
        max-width: 100%;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .meta .like-btn { justify-self: start; }
    }
    @media (max-width: 560px) {
      .wrap { width: calc(100% - 28px); padding-top: 3rem; }
      article.card { padding: 1.25rem 1.15rem 1.1rem; border-radius: 14px; }
      .tabs button { font-size: 0.75rem; padding: 0.38rem 0.7rem; }
    }

    .infinite-sentinel {
      height: 1px;
      width: 100%;
      pointer-events: none;
      overflow: hidden;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="intro">
      <h1>Lives Changed</h1>
      <p class="lede">
        Real stories from people whom <span class="nobr">Rabbi Yosef Mizrachi</span> has brought back to Hashem.
      </p>
      <p class="share">
        <a href="https://forms.gle/hSb4y6Kuzu4DGxyJ9" target="_blank" rel="noopener">Share your story</a>
      </p>
    </header>

    <div class="controls">
      <div class="tabs" role="tablist" aria-label="Sort stories">
        <button type="button" role="tab" data-sort="random" aria-selected="true">Random</button>
        <button type="button" role="tab" data-sort="newest" aria-selected="false">Newest</button>
        <button type="button" role="tab" data-sort="liked" aria-selected="false">Most liked</button>
      </div>
      <div class="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7" stroke-width="2"/><path d="M20 20l-3.2-3.2" stroke-width="2" stroke-linecap="round"/></svg>
        <input type="search" id="q" placeholder="Search stories or video titles" aria-label="Search stories or video titles">
      </div>
      <p class="count" id="count"></p>
    </div>
    <div class="cards" id="cards">
      <p class="empty">Loading stories…</p>
    </div>
    <div id="infinite-sentinel" class="infinite-sentinel" hidden aria-hidden="true"></div>

    <footer class="site-footer">
      These quotes are public YouTube comments, collected independently.
      This site is not affiliated with <span class="nobr">Rabbi Yosef Mizrachi</span>, his channel, or Divine Information.
    </footer>
  </div>

  <button type="button" class="theme-toggle" id="theme-toggle" aria-label="Switch to dark mode">
    <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M15.5 2.5a9.5 9.5 0 1 0 6 16.5 8 8 0 0 1-6-16.5z"/></svg>
    <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 3v1.6M12 19.4V21M3 12h1.6M19.4 12H21M5.6 5.6l1.1 1.1M17.3 17.3l1.1 1.1M18.4 5.6l-1.1 1.1M6.7 17.3l-1.1 1.1"/></svg>
  </button>

  <script>
    const cardsEl = document.getElementById("cards");
    const countEl = document.getElementById("count");
    const searchEl = document.getElementById("q");
    const LIKE_API = "https://countapi.mileshilliard.com/api/v1";
    const LIKE_PREFIX = "genoism-mizrachi-stories-like-";
    const LS_LIKED = "mizrachi-stories-liked-v1";
    const HEART = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12.1 20.3s-7.2-4.5-9.6-8.6C.6 8.8 1.2 5.1 4.4 3.6c2.3-1.1 5-.4 6.5 1.8 1.5-2.2 4.2-2.9 6.5-1.8 3.2 1.5 3.8 5.2 1.9 8.1-2.4 4.1-9.6 8.6-9.6 8.6z"/></svg>';

    const PAGE_SIZE = 10;
    const sentinelEl = document.getElementById("infinite-sentinel");
    let stories = [];
    let query = "";
    let sortMode = "random";
    let shownCount = 0;
    const randomRank = new Map();
    const likeCounts = Object.create(null);
    let likesReady = false;
    let likesFailed = false;

    function escapeHtml(s) {
      return String(s ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    function formatCardDate(value) {
      const raw = String(value ?? "").trim();
      const m = raw.match(/^(\d{4})-(\d{2})-(\d{2})(.*)$/);
      if (!m) return raw;
      const formatted = `${m[2]}/${m[3]}/${m[1]}`;
      const rest = m[4].trim();
      return rest ? `${formatted} ${rest}` : formatted;
    }

    function commentId(story) {
      try {
        return new URL(story.link).searchParams.get("lc") || "";
      } catch {
        return "";
      }
    }

    function likedSet() {
      try {
        const raw = JSON.parse(localStorage.getItem(LS_LIKED) || "[]");
        return new Set(Array.isArray(raw) ? raw : []);
      } catch {
        return new Set();
      }
    }

    function saveLiked(set) {
      try {
        localStorage.setItem(LS_LIKED, JSON.stringify([...set]));
      } catch (_) {}
    }

    function likeUrl(kind, id) {
      return `${LIKE_API}/${kind}/${encodeURIComponent(LIKE_PREFIX + id)}`;
    }

    async function fetchLike(kind, id) {
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), 8000);
      try {
        const res = await fetch(likeUrl(kind, id), { signal: ctrl.signal });
        if (res.status === 404) return 0;
        if (!res.ok) throw new Error("like api " + res.status);
        const data = await res.json();
        const n = Number(data.value);
        return Number.isFinite(n) ? n : 0;
      } finally {
        clearTimeout(timer);
      }
    }

    function visible() {
      const q = query.trim().toLowerCase();
      return stories.filter((s) => {
        if (!q) return true;
        const hay = [
          s.text,
          s.original_text,
          s.video_title
        ].join(" ").toLowerCase();
        return hay.includes(q);
      });
    }

    function randomInt(max) {
      if (max <= 1) return 0;
      if (window.crypto && crypto.getRandomValues) {
        const limit = Math.floor(0x100000000 / max) * max;
        const buf = new Uint32Array(1);
        let x;
        do {
          crypto.getRandomValues(buf);
          x = buf[0];
        } while (x >= limit);
        return x % max;
      }
      return Math.floor(Math.random() * max);
    }

    function shuffleInPlace(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = randomInt(i + 1);
        const tmp = arr[i];
        arr[i] = arr[j];
        arr[j] = tmp;
      }
      return arr;
    }

    function assignRandomOrder() {
      randomRank.clear();
      const order = stories.slice();
      shuffleInPlace(order);
      order.forEach((s, dest) => {
        const id = commentId(s) || ("i:" + dest);
        randomRank.set(id, dest);
      });
    }

    function dateKey(story) {
      const raw = String(story.date || "").trim();
      const m = raw.match(/^(\d{4})-(\d{2})-(\d{2})(?:\s+(\d{2}):(\d{2}))?/);
      if (!m) return 0;
      return Date.UTC(+m[1], +m[2] - 1, +m[3], m[4] ? +m[4] : 0, m[5] ? +m[5] : 0);
    }

    function sortedVisible() {
      const list = visible().slice();
      if (sortMode === "random") {
        list.sort((a, b) => {
          const ra = randomRank.get(commentId(a) || "") ?? 0;
          const rb = randomRank.get(commentId(b) || "") ?? 0;
          return ra - rb;
        });
        return list;
      }
      if (sortMode === "liked" && likesReady && !likesFailed) {
        list.sort((a, b) => {
          const ca = likeCounts[commentId(a)] || 0;
          const cb = likeCounts[commentId(b)] || 0;
          if (cb !== ca) return cb - ca;
          return dateKey(b) - dateKey(a);
        });
        return list;
      }
      list.sort((a, b) => dateKey(b) - dateKey(a));
      return list;
    }

    function loadLikeCounts() {
      const ids = stories.map(commentId).filter(Boolean);
      if (!ids.length) {
        likesReady = true;
        likesFailed = false;
        return;
      }
      Promise.allSettled(ids.map((id) => fetchLike("get", id).then((n) => {
        likeCounts[id] = n;
        return n;
      }))).then((results) => {
        const ok = results.some((r) => r.status === "fulfilled");
        likesReady = ok;
        likesFailed = !ok;
        if (sortMode === "liked") render();
      });
    }

    function displayText(story, showingOriginal) {
      if (showingOriginal && story.translated) return story.original_text || story.text;
      return story.text;
    }

    function setQuoteText(quoteEl, text) {
      quoteEl.replaceChildren();
      const parts = String(text || "").split("\n");
      parts.forEach((part, i) => {
        if (i) quoteEl.appendChild(document.createElement("br"));
        quoteEl.appendChild(document.createTextNode(part));
      });
    }

    function measureClamp(quoteEl, btn) {
      if (quoteEl.classList.contains("is-expanded")) {
        btn.hidden = false;
        btn.textContent = "Collapse";
        btn.setAttribute("aria-expanded", "true");
        return;
      }
      quoteEl.classList.remove("is-expanded");
      const overflowing = quoteEl.scrollHeight > quoteEl.clientHeight + 1;
      btn.hidden = !overflowing;
      btn.textContent = "Expand";
      btn.setAttribute("aria-expanded", "false");
    }

    function measureCard(card) {
      const quote = card.querySelector("blockquote.quote");
      const btn = card.querySelector(".expand-btn");
      if (quote && btn) measureClamp(quote, btn);
    }

    function scheduleMeasure(cards) {
      const run = () => cards.forEach(measureCard);
      requestAnimationFrame(run);
      if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(run).catch(() => {});
      }
    }

    function buildCard(s) {
      const id = commentId(s);
      const already = likedSet();
      const article = document.createElement("article");
      article.className = "card";

      if (s.translated) {
        const flags = document.createElement("div");
        flags.className = "flags";
        const mark = document.createElement("span");
        mark.className = "translated-mark";
        mark.textContent = "Translated";
        const toggle = document.createElement("button");
        toggle.type = "button";
        toggle.className = "orig-toggle";
        toggle.setAttribute("aria-pressed", "false");
        toggle.textContent = "Show original";
        flags.append(mark, toggle);
        article.appendChild(flags);
      }

      const quote = document.createElement("blockquote");
      quote.className = "quote";
      setQuoteText(quote, displayText(s, false));
      article.appendChild(quote);

      const expand = document.createElement("button");
      expand.type = "button";
      expand.className = "expand-btn";
      expand.hidden = true;
      expand.setAttribute("aria-expanded", "false");
      expand.textContent = "Expand";
      article.appendChild(expand);

      const meta = document.createElement("div");
      meta.className = "meta";
      const author = document.createElement("span");
      author.className = "author";
      author.textContent = s.author || "";
      meta.appendChild(author);
      if (s.date) {
        const date = document.createElement("span");
        date.className = "date";
        date.textContent = formatCardDate(s.date);
        meta.appendChild(date);
      }
      if (s.video_title) {
        const video = document.createElement("a");
        video.className = "video";
        video.href = s.link;
        video.target = "_blank";
        video.rel = "noopener noreferrer";
        video.textContent = s.video_title;
        meta.appendChild(video);
      }

      const likeBtn = document.createElement("button");
      likeBtn.type = "button";
      likeBtn.className = "like-btn";
      likeBtn.innerHTML = HEART + '<span class="like-count"></span>';
      const liked = Boolean(id && already.has(id));
      likeBtn.setAttribute("aria-pressed", liked ? "true" : "false");
      likeBtn.setAttribute("aria-label", liked ? "Liked" : "Like this story");
      if (liked) likeBtn.title = "You already liked this in this browser";
      const countSpan = likeBtn.querySelector(".like-count");
      meta.appendChild(likeBtn);

      article.appendChild(meta);

      expand.addEventListener("click", () => {
        const open = !quote.classList.contains("is-expanded");
        quote.classList.toggle("is-expanded", open);
        measureClamp(quote, expand);
      });

      const origToggle = article.querySelector(".orig-toggle");
      if (origToggle) {
        origToggle.addEventListener("click", () => {
          const showing = origToggle.getAttribute("aria-pressed") === "true";
          const next = !showing;
          origToggle.setAttribute("aria-pressed", next ? "true" : "false");
          origToggle.textContent = next ? "Show translation" : "Show original";
          quote.classList.remove("is-expanded");
          setQuoteText(quote, displayText(s, next));
          requestAnimationFrame(() => measureClamp(quote, expand));
        });
      }

      likeBtn.addEventListener("click", async () => {
        if (!id || likeBtn.getAttribute("aria-pressed") === "true" || likeBtn.classList.contains("is-busy")) {
          return;
        }
        likeBtn.classList.add("is-busy");
        try {
          const value = await fetchLike("hit", id);
          likeCounts[id] = value;
          countSpan.textContent = String(value);
          const set = likedSet();
          set.add(id);
          saveLiked(set);
          likeBtn.setAttribute("aria-pressed", "true");
          likeBtn.setAttribute("aria-label", "Liked");
          likeBtn.title = "You already liked this in this browser";
        } catch (_) {
          // API down: leave the button available to try again; don't store a like.
        } finally {
          likeBtn.classList.remove("is-busy");
        }
      });

      if (id && Object.prototype.hasOwnProperty.call(likeCounts, id)) {
        countSpan.textContent = String(likeCounts[id]);
      } else if (id) {
        fetchLike("get", id)
          .then((value) => {
            likeCounts[id] = value;
            countSpan.textContent = String(value);
          })
          .catch(() => { /* leave count blank if the API is down */ });
      }

      return article;
    }

    function syncSentinel(list) {
      if (!sentinelEl) return;
      sentinelEl.hidden = shownCount >= list.length;
    }

    function appendPage(list) {
      const next = list.slice(shownCount, shownCount + PAGE_SIZE);
      if (!next.length) {
        syncSentinel(list);
        return;
      }
      const added = next.map((s) => {
        const card = buildCard(s);
        cardsEl.appendChild(card);
        return card;
      });
      shownCount += next.length;
      scheduleMeasure(added);
      syncSentinel(list);
    }

    function fillAhead(list) {
      list = list || sortedVisible();
      while (shownCount < list.length && sentinelEl && !sentinelEl.hidden) {
        const rect = sentinelEl.getBoundingClientRect();
        if (rect.top >= window.innerHeight + 600) break;
        const before = shownCount;
        appendPage(list);
        if (shownCount === before) break;
      }
    }

    function render() {
      const list = sortedVisible();
      const total = stories.length;
      shownCount = 0;
      if (window.scrollY) window.scrollTo(0, 0);
      if (!list.length) {
        cardsEl.innerHTML = `<p class="empty">No stories match that search.</p>`;
        countEl.textContent = total ? `Showing 0 of ${total}` : "";
        if (sentinelEl) sentinelEl.hidden = true;
        return;
      }
      countEl.textContent = list.length === total
        ? `${total} ${total === 1 ? "story" : "stories"}`
        : `Showing ${list.length} of ${total}`;
      cardsEl.replaceChildren();
      if (sentinelEl) sentinelEl.hidden = false;
      appendPage(list);
      fillAhead(list);
    }

    if (sentinelEl && "IntersectionObserver" in window) {
      new IntersectionObserver((entries) => {
        if (entries.some((e) => e.isIntersecting)) fillAhead();
      }, { root: null, rootMargin: "600px 0px", threshold: 0 }).observe(sentinelEl);
    }

    window.addEventListener("resize", () => {
      cardsEl.querySelectorAll("article.card").forEach((card) => {
        const quote = card.querySelector("blockquote.quote");
        const btn = card.querySelector(".expand-btn");
        if (quote && btn) measureClamp(quote, btn);
      });
    });

    document.querySelectorAll(".tabs button").forEach((btn) => {
      btn.addEventListener("click", () => {
        sortMode = btn.dataset.sort || "random";
        document.querySelectorAll(".tabs button").forEach((b) => {
          b.setAttribute("aria-selected", b === btn ? "true" : "false");
        });
        if (sortMode === "random") assignRandomOrder();
        render();
      });
    });

    searchEl.addEventListener("input", () => {
      query = searchEl.value;
      render();
    });

    const THEME_KEY = "mizrachi-stories-theme";
    const themeToggle = document.getElementById("theme-toggle");
    const themeMq = window.matchMedia("(prefers-color-scheme: dark)");

    function effectiveTheme() {
      const saved = document.documentElement.getAttribute("data-theme");
      if (saved === "light" || saved === "dark") return saved;
      return themeMq.matches ? "dark" : "light";
    }

    function updateThemeToggle() {
      const next = effectiveTheme() === "dark" ? "light" : "dark";
      const label = next === "dark" ? "Switch to dark mode" : "Switch to light mode";
      themeToggle.setAttribute("aria-label", label);
      themeToggle.setAttribute("title", label);
    }

    themeToggle.addEventListener("click", () => {
      const next = effectiveTheme() === "dark" ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", next);
      try { localStorage.setItem(THEME_KEY, next); } catch (e) {}
      updateThemeToggle();
    });

    if (themeMq.addEventListener) {
      themeMq.addEventListener("change", () => {
        if (!document.documentElement.hasAttribute("data-theme")) updateThemeToggle();
      });
    } else if (themeMq.addListener) {
      themeMq.addListener(() => {
        if (!document.documentElement.hasAttribute("data-theme")) updateThemeToggle();
      });
    }
    updateThemeToggle();

    window.addEventListener("pageshow", (e) => {
      if (e.persisted && stories.length) {
        assignRandomOrder();
        if (sortMode === "random") render();
      }
    });

    fetch("./stories.json?v=" + Date.now(), { cache: "no-store" })
      .then((r) => {
        if (!r.ok) throw new Error("Could not load stories.json");
        return r.json();
      })
      .then((data) => {
        stories = Array.isArray(data) ? data : (data.stories || []);
        assignRandomOrder();
        render();
        loadLikeCounts();
      })
      .catch((err) => {
        cardsEl.innerHTML = `<p class="error">The stories could not be loaded. ${escapeHtml(err.message)}</p>`;
      });
  </script>
</body>
</html>
